name: "AN4_ASR_Finetune"

# Set one of these:
init_from_nemo_model: null
init_from_pretrained_model: "stt_en_conformer_ctc_small"

model:
  sample_rate: 16000

  train_ds:
    manifest_filepath: /workspace/data/an4/an4/train_manifest.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 20
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "fully_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: /workspace/data/an4/an4/test_manifest.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 4
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 4
    pin_memory: true

  char_labels:
    update_labels: false
    labels: null

  tokenizer:
    update_tokenizer: false
    dir: null
    type: bpe

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  optim:
    name: adamw
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 100
      warmup_ratio: null
      min_lr: 5e-6

trainer:
  devices: 1
  num_nodes: 1
  max_epochs: 10
  max_steps: -1
  val_check_interval: 1.0
  accelerator: gpu
  strategy: auto
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: bf16-mixed  # Ampere/Hopper/GB; swap to 16-mixed on older GPUs
  log_every_n_steps: 10
  enable_progress_bar: true
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: false
  logger: false
  benchmark: false

exp_manager:
  exp_dir: /workspace/outputs
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
    always_save_nemo: true
  resume_if_exists: false
  resume_ignore_no_checkpoint: false
  create_wandb_logger: false
